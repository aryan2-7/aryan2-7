name: refresh profile stats

# Deliberately no `push` trigger: this job commits SVGs back to the repo,
# and a push trigger would make it re-run on its own commit.
#
# Two cron entries give the workflow two chances to run each day.
# GitHub Actions scheduled workflows use UTC.
on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "32 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Draw the stat graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          OUT_DIR: assets
        run: python scripts/generate_stats.py

      - name: Generate heatmap
        env:
          GH_TOKEN: ${{ secrets.HEATMAP_TOKEN }}
          GH_USERNAME: ${{ vars.HEATMAP_USERNAME }}
        run: python scripts/generate_heatmap.py

      - name: Bust README image cache
        run: |
          sed -i -E 's#(assets/(stats|streak|langs|heatmap)\.svg)(\?v=[0-9]+)?#\1?v=${{ github.run_number }}#g' README.md

      - name: Commit whatever changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stats.svg
          git add assets/streak.svg
          git add assets/langs.svg
          git add assets/heatmap.svg
          git add assets/hd-*.svg
          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "stats: refresh profile graphics [${{ github.event_name }}]"
          git push
