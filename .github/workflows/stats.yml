name: refresh profile stats

# Deliberately no `push` trigger: this job commits SVGs back to the repo,
# and a push trigger would make it re-run on its own commit.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Draw the stat graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          OUT_DIR: assets
        run: python3 scripts/generate_stats.py

      - name: Generate heatmap
        env:
          GH_TOKEN: ${{ secrets.HEATMAP_TOKEN }}
          GH_USERNAME: ${{ vars.HEATMAP_USERNAME }}
        run: python3 scripts/generate_heatmap.py

      - name: Bust README image cache
        # GitHub's camo/raw.githubusercontent.com proxy caches <img> URLs by
        # exact string. Committing a new SVG under the same URL isn't enough
        # to bust that cache, so this rewrites the ?v= query param on every
        # generated-asset <img> tag to the run number, forcing a fresh fetch
        # each time this workflow runs.
        run: |
          sed -i -E "s/(assets\/(stats|streak|langs|heatmap)\.svg)(\?v=[0-9]+)?/\1?v=${{ github.run_number }}/g" README.md

      - name: Commit whatever changed
        run: |
          FILES="assets/stats.svg assets/streak.svg assets/langs.svg assets/hd-*.svg assets/heatmap.svg README.md"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh profile graphics"
          git push
