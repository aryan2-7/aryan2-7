name: refresh profile stats

# Deliberately no `push` trigger: this job commits SVGs back to the repo,
# and a push trigger would make it re-run on its own commit.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Draw the stat graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          OUT_DIR: assets
          README_PATH: README.md
        run: python3 scripts/generate_stats.py

      - name: Generate heatmap
        env:
          GH_TOKEN: ${{ secrets.HEATMAP_TOKEN }}
          GH_USERNAME: ${{ vars.HEATMAP_USERNAME }}
        run: python3 scripts/generate_heatmap.py

      - name: Commit whatever changed
        run: |
          FILES="assets/stats.svg assets/streak.svg assets/langs.svg assets/hd-*.svg assets/heatmap.svg README.md"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh profile graphics"
          git push
